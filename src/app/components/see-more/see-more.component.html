<span class="text" [ngStyle]="{'-webkit-line-clamp': !see_more_active ? line_limit : null}" [innerHTML]="text | linkify"></span>
<span>
  <button type="button" class="see-more-toggle" (click)="toggleSeeMore()" [attr.aria-expanded]="see_more_active">
    @if (!see_more_active) {
      <ng-container i18n="See more">
            See more.
        </ng-container>
    }
    @if (see_more_active) {
      <ng-container i18n="See less">
            See less.
        </ng-container>
    }
  </button>
</span>
