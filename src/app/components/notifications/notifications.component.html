<div class="notifications-connection-state" *ngIf="notifications_connection_error" role="alert">
    <mat-icon>cloud_off</mat-icon>
    <span i18n="Notifications refresh failure@@notifications-refresh-failed">Unable to load notifications.</span>
    <button mat-stroked-button color="accent" (click)="getNotifications()" i18n="Retry action@@retry-action">Retry</button>
</div>
<div *ngIf="notifications !== null && notifications.length === 0" style="text-align: center; margin: 10px;" i18n="No notifications available">No notifications available</div>
<div *ngIf="notifications?.length > 0">
    <div class="notifications-list-parent">
        <mat-chip-listbox [value]="selectedFilters" [multiple]="true" (change)="selectedFiltersChanged($event)">
            <mat-chip-option *ngFor="let filter of notificationFilters | keyvalue: originalOrder" [value]="filter.key" [selected]="selectedFilters.includes(filter.key)" color="accent">{{filter.value.label}}</mat-chip-option>
        </mat-chip-listbox>
        <div *ngIf="filtered_notifications?.length === 0" class="notifications-empty" i18n="No notifications available">No notifications available</div>
        <app-notifications-list *ngIf="filtered_notifications?.length > 0" class="notifications-list" [style.height]="list_height" (notificationAction)="notificationAction($event)" (deleteNotification)="deleteNotification($event)" [notifications]="filtered_notifications"></app-notifications-list>
    </div>
    <button style="margin: 10px 0px 2px 10px;" *ngIf="notifications?.length > 0" color="warn" (click)="deleteAllNotifications()" mat-stroked-button>Remove all</button>
</div>
