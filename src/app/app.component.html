<div [style.background]="postsService.theme ? postsService.theme.background_color : null" style="width: 100%; height: 100%;">
    <div class="mat-elevation-z3" style="position: relative; z-index: 10;">
        <mat-toolbar class="sticky-toolbar top-toolbar">
            <div class="container-fluid" style="padding-left: 0px; padding-right: 0px">
                <div class="row" width="100%" height="100%">
                    <div class="col-6" style="text-align: left; margin-top: 1px;">
                        <div style="display: flex; align-items: center;">
                            <button #hamburgerMenu *ngIf="router.url.split(';')[0] !== '/player'" mat-icon-button [attr.aria-label]="navigationActionLabels.toggleSideNavigation" (click)="toggleSidenav()"><mat-icon>menu</mat-icon></button>
                            <button (click)="goBack()" *ngIf="router.url.split(';')[0] === '/player'" mat-icon-button [attr.aria-label]="navigationActionLabels.back"><mat-icon>arrow_back</mat-icon></button>
                            <div style="margin-left: 8px; display: inline-block;"><button mat-icon-button routerLink='/home' aria-label="Home" i18n-aria-label="Home navigation button"><img style="width: 32px;" src="assets/images/logo_128px.png" alt=""></button></div>
                        </div>
                    </div>
                    <div class="col-6" style="text-align: right; align-items: flex-end; display: inline-block">
                        <button *ngIf="postsService.config?.Extra.enable_notifications" [matMenuTriggerFor]="notificationsMenu" (menuOpened)="notificationMenuOpened()" mat-icon-button aria-label="Notifications" i18n-aria-label="Notifications menu button"><mat-icon [matBadge]="notification_count" matBadgeColor="warn" matBadgeSize="small" *ngIf="notification_count > 0">notifications</mat-icon><mat-icon *ngIf="notification_count === 0">notifications_none</mat-icon></button>
                        <mat-menu [classList]="'notifications-menu'" (close)="notificationMenuClosed()" #notificationsMenu="matMenu">
                            <app-notifications #notifications (notificationCount)="notificationCountUpdate($event)" (click)="$event.stopPropagation()"></app-notifications>
                        </mat-menu>
                        <button [matMenuTriggerFor]="menuSettings" mat-icon-button aria-label="Settings" i18n-aria-label="Settings menu button"><mat-icon>more_vert</mat-icon></button>
                        <mat-menu #menuSettings="matMenu">
                            <button class="top-menu-button" (click)="openProfileDialog()" mat-menu-item>
                                <mat-icon>person</mat-icon>
                                <span i18n="Profile menu label">Profile</span>
                            </button>
                            <button *ngIf="!postsService.config?.Advanced.multi_user_mode || postsService.isLoggedIn" class="top-menu-button" (click)="openArchivesDialog()" mat-menu-item>
                                <mat-icon>topic</mat-icon>
                                <span i18n="Archives menu label">Archives</span>
                            </button>
                            <button class="top-menu-button" (click)="themeMenuItemClicked($event)" *ngIf="allowThemeChange" mat-menu-item>
                            <mat-icon>{{(postsService.theme.key === 'default') ? 'brightness_5' : 'brightness_2'}}</mat-icon>
                            <span i18n="Dark mode toggle label">Dark</span>
                            <mat-slide-toggle class="theme-slide-toggle" [checked]="postsService.theme.key === 'dark'" tabindex="-1" aria-hidden="true"></mat-slide-toggle>
                            </button>
                            <button class="top-menu-button" (click)="openAboutDialog()" mat-menu-item>
                                <mat-icon>info</mat-icon>
                                <span i18n="About menu label">About</span>
                            </button>
                        </mat-menu>
                    </div>
                </div>
            </div>
        </mat-toolbar>
    </div>
    <div class="sidenav-container" style="height: calc(100% - 64px)">
        <mat-sidenav-container style="height: 100%">
            <mat-sidenav [opened]="postsService.sidepanel_mode === 'side' && !window.location.href.includes('/player')" [mode]="postsService.sidepanel_mode" #sidenav>
                <mat-nav-list>
                    <a *ngIf="postsService.config && (!postsService.config.Advanced.multi_user_mode || postsService.isLoggedIn)" mat-list-item (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null" routerLink='/home' routerLinkActive="active-navigation-item" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page"><ng-container i18n="Navigation menu Home Page title">Home</ng-container></a>
                    <a *ngIf="postsService.config && postsService.config.Advanced.multi_user_mode && !postsService.isLoggedIn" mat-list-item (click)="sidenav.close()" routerLink='/login' routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page"><ng-container i18n="Navigation menu Login Page title">Login</ng-container></a>
                    <a *ngIf="postsService.config && allowSubscriptions && postsService.hasPermission('subscriptions')" mat-list-item (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null" routerLink='/subscriptions' routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page"><ng-container i18n="Navigation menu Subscriptions Page title">Subscriptions</ng-container></a>
                    <a *ngIf="postsService.config && enableDownloadsManager && postsService.hasPermission('downloads_manager')" mat-list-item (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null" routerLink='/downloads' routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page"><ng-container i18n="Navigation menu Downloads Page title">Downloads</ng-container></a>
                    <a *ngIf="postsService.config && postsService.hasPermission('tasks_manager')" mat-list-item (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null" routerLink='/tasks' routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page"><ng-container i18n="Navigation menu Tasks Page title">Tasks</ng-container></a>
                    <ng-container *ngIf="postsService.config && postsService.hasPermission('settings')">
                        <a mat-list-item (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null" routerLink='/settings' routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page"><ng-container i18n="Settings menu label">Settings</ng-container></a>
                    </ng-container>
                    <ng-container *ngIf="postsService.config && allowSubscriptions && postsService.subscriptions?.length && postsService.hasPermission('subscriptions')">
                        <mat-divider></mat-divider>
                        <div class="navigation-section-header">
                            <div mat-subheader class="navigation-section-label" i18n="Navigation menu Subscriptions Page title">Subscriptions</div>
                            <button class="subscription-navigation-toggle" mat-icon-button type="button" aria-label="Subscriptions" i18n-aria-label="Navigation menu Subscriptions Page title" [attr.aria-expanded]="subscriptionsExpanded" (click)="toggleSubscriptions()">
                                <mat-icon aria-hidden="true">{{subscriptionsExpanded ? 'expand_less' : 'expand_more'}}</mat-icon>
                            </button>
                        </div>
                        <ng-container *ngIf="subscriptionsExpanded">
                            <mat-form-field *ngIf="postsService.subscriptions.length > 5" class="subscription-navigation-search" appearance="outline">
                                <mat-label i18n="Search">Search</mat-label>
                                <input matInput type="search" [(ngModel)]="subscriptionSearchTerm">
                                <mat-icon matSuffix aria-hidden="true">search</mat-icon>
                            </mat-form-field>
                            <a *ngFor="let subscription of getFilteredSubscriptions()" mat-list-item (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null" [routerLink]="['/subscription', { id: subscription.id }]" routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page" [matTooltip]="subscription.name">
                                <ngx-avatars class="subscription-navigation-avatar" size="32" [name]="subscription.name"></ngx-avatars>
                                <span class="subscription-navigation-name">{{subscription.name}}</span>
                            </a>
                        </ng-container>
                    </ng-container>
                </mat-nav-list>
            </mat-sidenav>
            <mat-sidenav-content [style.background]="postsService.theme ? postsService.theme.background_color : null">
                <router-outlet></router-outlet>
            </mat-sidenav-content>
        </mat-sidenav-container>
    </div>
</div>
